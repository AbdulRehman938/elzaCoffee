<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elzaCoffee | Premium Coffee Experience</title>
    <link rel="icon" href="assets/logo.png">
    <!-- Combined styles for the main page -->
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/story.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/services.css">
    <link rel="stylesheet" href="css/reserve.css">
    <link rel="stylesheet" href="css/recommanded.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/testimonials.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/account-modal.css">
    <link rel="stylesheet" href="css/cart-modal.css">

</head>
<body>
    
    <!-- Account Modal -->
    <div id="account-modal-placeholder"></div>

    <!-- Cart Modal -->
    <div id="cart-modal-placeholder"></div>

    <!-- Decorative Corner Bulb -->
    <div class="corner-bulb"></div>

    <!-- Global Wrapper to control page width -->
    <div id="global-wrapper" style="max-width: 1600px; margin: 0 auto; width: 100%; position: relative;">
        <!-- Component Placeholders -->
        <div id="header-placeholder"></div>
        
        <main id="main-content">
            <div id="hero-placeholder" data-section="home"></div>
            
            <!-- Global Background Beans (Starts after Hero) -->
            <div class="global-beans-bg">
                <img src="assets/Coffee beans.png" alt="">
            </div>

            <!-- Story Section -->
            <div id="story-placeholder"></div>

            <!-- Services Section -->
            <div id="services-placeholder" data-section="services"></div>

            <!-- Reserve Section -->
            <div id="reserve-placeholder" data-section="contact"></div>

            <!-- Recommended Section -->
            <div id="recommanded-placeholder" data-section="product"></div>

            <!-- Menu Section -->
            <div id="menu-placeholder" data-section="menu"></div>

            <!-- Blog Section -->
            <div id="blog-placeholder" data-section="blog"></div>

            <!-- Testimonials Section -->
            <div id="testi-placeholder"></div>
            
            <!-- Footer Section (Full Page Width) -->
            <div id="footer-placeholder"></div>
        </main>
    </div>

    <!-- GSAP & SplitText -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://assets.codepen.io/16327/SplitText3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="js/hero.js"></script>
    <script src="js/story.js"></script>
    <script src="js/reserve.js"></script>
    <script src="js/recommanded.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/testimonials.js"></script>
    <script src="js/renderer.js"></script>
</body>
</html>
