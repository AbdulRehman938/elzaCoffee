<!-- Cart Modal -->
<div id="cart-modal" class="cart-modal-overlay" aria-hidden="true">
    <div class="cart-modal-panel">

        <!-- Header -->
        <div class="cart-header">
            <div class="cart-header-left">
                <img src="assets/ph_shopping-cart-light.png" width="20" height="20" alt="" style="opacity:0.7">
                <h3 class="cart-title">Your Cart</h3>
                <span class="cart-count-badge" id="cart-header-count">0 items</span>
            </div>
            <button class="cart-close-btn" id="cart-modal-close" aria-label="Close cart">&#x2715;</button>
        </div>

        <!-- Items List -->
        <div class="cart-items" id="cart-items-container">
            <div class="cart-empty-state">
                <img src="assets/ph_shopping-cart-light.png" alt="" class="empty-icon">
                <p>Your cart is empty.</p>
                <a href="shop.html" class="empty-shop-link">Go to Shop</a>
            </div>
        </div>

        <!-- Summary (Initially hidden or shown as zero) -->
        <div id="cart-summary-section" style="display: none;">
            <!-- Summary -->
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span class="delivery-fee">$2.00</span>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="cart-total">$0.00</span>
                </div>
            </div>

            <!-- Checkout Button -->
            <button class="cart-checkout-btn" id="cart-checkout-btn">
                Proceed to Checkout →
            </button>
        </div>

        <p class="cart-note">Free delivery on orders above $30 · Secure payment</p>
    </div>
</div>
