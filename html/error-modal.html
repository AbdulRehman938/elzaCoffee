<div id="error-modal" class="error-modal-overlay">
    <div class="error-modal-card">
        <div class="error-icon">
            <img src="assets/mdi-light_account.png" alt="Login Required">
        </div>
        <h2 class="error-title">Login Required</h2>
        <p class="error-message">Please log in to your account to add items to your cart and complete your purchase.</p>
        <div class="error-actions">
            <button class="error-btn-primary" id="error-login-btn">Login Now</button>
            <button class="error-btn-secondary" id="error-close-btn">Maybe Later</button>
        </div>
    </div>
</div>
