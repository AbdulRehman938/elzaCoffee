<div class="checkout-modal-overlay" id="checkout-modal">
    <div class="checkout-modal-panel">
        <div class="checkout-header">
            <h3>Secure Checkout</h3>
            <button class="checkout-close-btn" id="checkout-modal-close">✕</button>
        </div>

        <div class="checkout-content">
            <!-- Step Indicators -->
            <div class="checkout-steps">
                <div class="step active" data-step="1">1. Shipping</div>
                <div class="step" data-step="2">2. Payment</div>
            </div>

            <!-- Form -->
            <form id="checkout-form">
                <!-- Step 1: Shipping -->
                <div class="checkout-step-view active" id="step-1">
                    <div class="input-group">
                        <label>Shipping Address</label>
                        <textarea id="checkout-address" placeholder="Enter your full street address, city, and zip code..." required></textarea>
                        <span class="error-msg" id="checkout-address-error"></span>
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="checkout-phone" placeholder="+1 (555) 000-0000" required>
                    </div>
                    <button type="button" class="checkout-next-btn" id="to-step-2">Next: Payment Method</button>
                </div>

                <!-- Step 2: Payment -->
                <div class="checkout-step-view" id="step-2">
                    <div class="payment-options">
                        <label class="payment-card selected">
                            <input type="radio" name="payment" value="cod" checked>
                            <div class="payment-info">
                                <strong>Cash on Delivery</strong>
                                <p>Pay when your coffee arrives</p>
                            </div>
                        </label>
                        <label class="payment-card disabled">
                            <input type="radio" name="payment" value="card" disabled>
                            <div class="payment-info">
                                <strong>Credit / Debit Card</strong>
                                <p>Coming Soon</p>
                            </div>
                        </label>
                    </div>
                    
                    <div class="order-summary-mini">
                        <div class="summary-line">
                            <span>Subtotal</span>
                            <span id="checkout-subtotal">$0.00</span>
                        </div>
                        <div class="summary-line total">
                            <span>Total to Pay</span>
                            <span id="checkout-total">$0.00</span>
                        </div>
                    </div>

                    <button type="submit" class="checkout-submit-btn">Place Your Order</button>
                    <button type="button" class="checkout-back-btn" id="to-step-1">Back to Shipping</button>
                </div>
            </form>
        </div>
    </div>
</div>
